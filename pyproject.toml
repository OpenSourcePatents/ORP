[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orp"
version = "0.0.1"
description = "Open Reentry Platform — a forward-only atmospheric reentry simulator with first-class data provenance."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Charles W. Dowd Jr.", email = "bedbugcharlie@gmail.com" },
]
keywords = [
    "reentry",
    "atmospheric-entry",
    "trajectory",
    "simulation",
    "aerodynamics",
    "mars",
    "provenance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/OpenSourcePatents/ORP"
Source = "https://github.com/OpenSourcePatents/ORP"

[tool.setuptools.packages.find]
include = ["orp*"]

[tool.setuptools.package-data]
orp = ["data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["orp/tests"]
python_files = ["test_*.py"]
