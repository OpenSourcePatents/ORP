[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orp"
dynamic = ["version"]
description = "Open Reentry Platform — a forward-only atmospheric reentry simulator with first-class data provenance."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Charles Walter Dowd Jr.", email = "opensourcepatents@gmail.com" },
]
keywords = [
    "reentry",
    "atmospheric-entry",
    "trajectory",
    "aerospace",
    "simulation",
]
classifiers = [
    # The OSI license classifier is intentionally absent: PEP 639 superseded license
    # classifiers with the license expression above, and setuptools >= 77 rejects the
    # combination (InvalidConfigError). PyPI renders the license from the expression.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
plot = [
    "matplotlib>=3.6",
]
gui = [
    "PyQt6>=6.5",
    "matplotlib>=3.6",
]

[project.scripts]
orp = "orp.cli:main"

[project.urls]
Homepage = "https://orp.opensourceforall.com"
Source = "https://github.com/OpenSourcePatents/ORP"
Companion = "https://github.com/OpenSourcePatents/OpenReentry"

[tool.setuptools.dynamic]
version = { attr = "orp.__version__" }

[tool.setuptools.packages.find]
include = ["orp*"]

[tool.setuptools.package-data]
orp = ["data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["orp/tests"]
python_files = ["test_*.py"]
