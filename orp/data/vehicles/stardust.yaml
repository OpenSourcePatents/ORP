# ORP vehicle definition — Stardust Sample Return Capsule (SRC)
# Earth reentry, ballistic 60-degree sphere-cone. Fastest Earth entry ever flown
# (~12.9 km/s inertial, 2006-01-15). Geometry from Mitcheltree AIAA 97-2304 (NTRS
# 20040105538), text-extracted. Every property carries a validation level and source.
# Canonical units: mass kg, area m^2, length m, coefficients dimensionless, angles radians.
name: Stardust SRC
intended_planet: earth
description: >
  Stardust Sample Return Capsule: a 60-degree half-angle sphere-cone, 0.8128 m base
  diameter, spin-stabilized (~13.5 rpm), flown ballistically (L/D ~ 0). Forebody outer
  mold line from Mitcheltree et al., AIAA 97-2304 (NTRS 20040105538): nose radius 0.2286 m,
  shoulder radius 0.01905 m, frontal area 0.51887 m^2, c.g. at 0.35D back from the nose.
  Entry-interface conditions (radius 6503.14 km, 12.9 km/s inertial at -8.2 deg, azimuth
  102.9 deg) are scenario inputs encoded in the Stardust gate, not here. The full CD-vs-Mach
  curve is figure-based in the source; this file carries the hypersonic-continuum value.

properties:
  mass:
    value: 46.0
    unit: kg
    validation: ASSERTED
    source: "Desai & Qualls, 'Stardust Entry Reconstruction', AIAA-2008-1198 (NTRS 20080008567): 46 kg (text-stated)"
    notes: >
      Entry-interface mass of the sample return capsule. Source tightened 2026-06-10:
      46 kg is text-stated in the pinned reconstruction primary (dual-channel verified),
      no longer 'commonly cited'.

  reference_area:
    value: 0.51887
    unit: m^2
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304 (NTRS 20040105538): frontal area 0.51887 m^2 (text)"
    notes: "Reference area = frontal area of the 0.8128 m diameter forebody."

  nose_radius:
    value: 0.2286
    unit: m
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304 (NTRS 20040105538): nose radius 0.2286 m (text)"
    notes: "Spherical nose radius of the 60-deg sphere-cone forebody (pre-ablation)."

  drag_coefficient:
    value: 1.50
    unit: ""
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304 (NTRS 20040105538), Table 4 (LAURA, zero-AoA): continuum C_A 1.4816-1.5636 over Mach 12.2-42.7; mean 1.50 stored"
    notes: >
      Hypersonic continuum (M > 12) zero-angle-of-attack axial coefficient from Table 4
      (LAURA): 1.5636 (M42.7), 1.4959 (M40), 1.4828 (M35.4), 1.4816 (M24.7), 1.4939
      (M17.1), 1.4992 (M12.2); mean 1.50. CORRECTION 2026-06-10: the previously stored
      1.61 attributed to this source does not appear anywhere in it (dual-channel
      transcription verification, pixel + text layer); 1.61 was a mis-extraction. The
      full C_A-vs-Mach curve below M~12 remains figure-based; the forward sim uses this
      constant CD.

  lift_to_drag:
    value: 0.0
    unit: ""
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304: ballistic, spin-stabilized (~13.5 rpm) -> no net trim lift"
    notes: "Ballistic entry by design; zero net L/D (spin averages out small trim asymmetries)."

  trim_angle_of_attack:
    value: 0.0
    unit: rad
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304: spin-stabilized ballistic; nominal zero incidence"
    notes: >
      Nominal zero. The capsule is statically unstable about its as-flown c.g. (0.35D) at low
      Knudsen number and oscillates; spin stabilization keeps the time-averaged lift ~0.

  half_cone_angle:
    value: 1.0472
    unit: rad
    validation: ASSERTED
    source: "Mitcheltree et al., AIAA 97-2304 (NTRS 20040105538): 60-deg half-angle sphere-cone (text)"
    notes: "60 deg cone half-angle measured from the axis."

# Transcription status (2026-06-10): dual-channel verification (blind pixel transcripts vs
# PDF text layer). Geometry (60 deg, Rn 0.2286 m, shoulder 0.01905 m, D 0.8128 m, area
# 0.51887 m^2, c.g. 0.35D) DUAL-CHANNEL VERIFIED vs Mitcheltree AIAA 97-2304. DISCREPANCY
# found and corrected: CD 1.61 (previously attributed to Mitcheltree 'text/table') appears
# nowhere in that source; replaced with Table-4 LAURA zero-AoA continuum mean 1.50
# (range 1.4816-1.5636, M 12.2-42.7). Mass 46 kg / spin 13.5 rpm / EI conditions
# DUAL-CHANNEL VERIFIED vs Desai & Qualls NTRS 20080008567.
